<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KinWhy AI</title>
<meta name="description" content="ถ่ายรูปมื้ออาหาร แล้วดูสัดส่วนผัก ข้าว-แป้ง โปรตีน เทียบจานสุขภาพ 2:1:1 โมเดลรันในเครื่องของคุณ รูปไม่ออกจากเครื่อง">
<meta name="theme-color" content="#F6F1E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14120F" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="KinWhy">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans+Thai+Looped:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Edge refraction for the glass dock (Chromium only; other browsers get the plain blur). -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <filter id="lg-refract" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
    <feImage id="lg-map" result="map" preserveAspectRatio="none" href=""/>
    <feDisplacementMap in="SourceGraphic" in2="map" scale="22" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<main id="view" tabindex="-1"></main>

<nav class="dock" aria-label="เมนูหลัก">
  <div class="dock-bar glass glass-refract">
    <a class="tab" href="#/" data-tab="today"><svg class="ic" viewBox="0 0 24 24"><path d="M7 3v8a2 2 0 0 0 2 2v8M7 3v5M11 3v5a2 2 0 0 1-2 2M17 21V3c-2 1.5-3 4-3 7s1 4 3 4"/></svg><span>วันนี้</span></a>
    <label class="capture" for="file-input">
      <svg class="ic" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>
      <span>ถ่ายมื้อนี้</span>
    </label>
    <a class="tab" href="#/history" data-tab="history"><svg class="ic" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg><span>ประวัติ</span></a>
  </div>
</nav>
<!-- No `capture`: phones then offer both "take photo" and "photo library". -->
<input id="file-input" type="file" accept="image/*" hidden>

<div id="toast" class="toast glass" role="status" aria-live="polite" hidden></div>

<script type="module" src="app.js"></script>
</body>
</html>
